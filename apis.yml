aid: privacera
name: Privacera
description: >-
  Privacera, now branded Trust3 AI, is a unified data and AI governance platform founded by
  the creators of Apache Ranger. It delivers sensitive-data discovery, centralized access
  control and policy enforcement, encryption and masking, and access auditing across cloud
  data platforms including Snowflake, Databricks, AWS, Azure, Google Cloud and Oracle, plus
  AI governance for LLM and agentic workflows, RAG and Vector DB access control, and prompt
  filtering. Its open-source PAIG (Privacera AI Governance) project provides security, safety
  and observability guardrails for GenAI applications, and it exposes REST APIs (Apache Ranger
  API, Discovery Scan API, PEG API, Policy Ops Server API) plus first-party Python client
  libraries for programmatic governance.
